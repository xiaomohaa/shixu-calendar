[package]
name = "shixu-calendar"
version = "2.0.0-alpha.1"
description = "时序日历 Tauri 桌面版"
authors = ["Shixu Calendar"]
license = "MIT"
repository = "https://github.com/xiaomohaa/shixu-calendar"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shixu_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
chrono-tz = "=0.10.4"
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
zeroize = "=1.8.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
reqwest = { version = "=0.12.24", features = ["gzip"] }
roxmltree = "=0.21.1"
uuid = { version = "=1.29.0", features = ["v4"] }
chrono = { version = "=0.4.45", features = ["clock"] }
tokio = { version = "1.54", features = ["time", "sync", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
minisign-verify = "0.3"
